{% extends "base.html" %}

{% block title %}Schedule Interview{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Schedule Interview</h1>
        <p>Add and manage your job interview details.</p>
    </div>
</div>

<div class="applications-section">

    <form method="POST" class="application-form">

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <div class="form-grid">

            <div class="form-group">
                <label for="application_id">Select Company *</label>

                <select name="application_id" id="application_id" required>
                    <option value="">Select an application</option>

                    {% for application in applications %}
                    <option value="{{ application.id }}">
                        {{ application.company_name }} - {{ application.job_role }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label for="interview_date">Interview Date *</label>

                <input type="date"
                       name="interview_date"
                       id="interview_date"
                       required>
            </div>

            <div class="form-group">
                <label for="interview_time">Interview Time</label>

                <input type="time"
                       name="interview_time"
                       id="interview_time">
            </div>

            <div class="form-group">
                <label for="status">Interview Status</label>

                <select name="status" id="status" required>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

        </div>

        <div class="form-group">
            <label for="notes">Interview Notes</label>

            <textarea name="notes"
                      id="notes"
                      rows="4"
                      placeholder="Enter interview preparation notes..."></textarea>
        </div>

        <div class="form-actions">

            <a href="{{ url_for('interviews') }}"
               class="cancel-button">Cancel</a>

            <button type="submit" class="add-button">
                Save Interview
            </button>

        </div>

    </form>

</div>

{% endblock %}
